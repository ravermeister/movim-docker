server {
    listen 18443;
    listen [::]:18443;
    
    # 1. Redirect to movim main url
    location / {
        return 301 ${MOVIM_MAIN_URL};
    }

    # 2. ERLAUBEN: Die WebSocket-Verbindungen für das Video-Streaming
    location /ws/ {
        proxy_pass http://127.0.0.1:18444; 
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 6h;
        proxy_send_timeout 6h;
    }

    # 3. ERLAUBEN: Die API-Steuerung für die galener.php Komponente
    location /api/ {
        proxy_pass http://127.0.0.1:18444;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}