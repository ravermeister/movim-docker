# docker in docker template
.dind:
  image: docker
  services:
    - name: docker:dind
      command: ["--experimental"]
  tags:
    - docker
    - arm64
  before_script:    
  !reference [.init_alpine_docker, before_script]
    # custom commands as array below
  after_script:
    # custom commands as array above
  !reference [.init_alpine_docker, after_script]

.galene:
  image: golang:1.27-alpine  
  tags:
    - docker
    - arm64
  dependencies: []
  needs: []
  before_script:
  !reference [.init_alpine_golang, before_script]
    # custom commands as array below
    - apk add --no-cache wget tar git
  after_script:
    # custom commands as array above
  !reference [.init_alpine_golang, after_script]
  script:
    # see https://github.com/jech/galene/blob/master/galene-install.md
    # build galene
    - git clone "$GALENER_REPOSITORY" galene && cd galene
    - CGO_ENABLED=0 go build -ldflags='-s -w'
    # load mediapipe
    - mkdir mediapipe && cd mediapipe    
    - wget https://registry.npmjs.org/@mediapipe/tasks-vision/-/tasks-vision-$GALENE_TASKS_VISION_VERSION.tgz
    - tar xzf tasks-vision-$GALENE_TASKS_VISION_VERSION.tgz
    - rm -f ../static/third-party/tasks-vision
    - mv package ../static/third-party/tasks-vision
    - cd ../static/third-party/tasks-vision
    - mkdir models && cd models
    - wget -qO selfie_segmenter.tflite https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite
    - cd "$CI_PROJECT_DIR/galene"
    # save assets
    - tar czf "$CI_PROJECT_DIR/assets/galene.tgz" galene static data groups
  artifacts:
    name: galene
    paths:
      - "$CI_PROJECT_DIR/assets/galene.tgz"
####################################

### galene arm64
galene_arm64:
  stage: create
  extends: .galene
  rules:
    - if: $CI_SERVER_URL == "https://gitlab.rimkus.it"

### create arm64
image_arm64:
  extends: .dind
  stage: create
  dependencies: 
    - galene_arm64
  needs: 
    - galene_arm64
  rules:
    - if: $CI_SERVER_URL == "https://gitlab.rimkus.it"
  script:    
    - echo "build Movim Version $MOVIM_VERSION"
    - >
      docker buildx build --no-cache --force-rm --compress --load \
        --platform "linux/arm64" \
        --build-arg MOVIM_GIT_REPO=$MOVIM_REPOSITORY \
        --build-arg MOVIM_VERSION=$MOVIM_VERSION \
        -t "${IMAGE_NAME}" \
        -t "${CI_REGISTRY_IMAGE}:arm64" \
        --target movim-arm64 \
        .
    - docker push "${CI_REGISTRY_IMAGE}:arm64"

### galene amd64
galene_amd64:
  stage: create
  extends: .galene
  tags:
    - gitlab-org-docker
  rules:
    - if: $CI_SERVER_URL == "https://gitlab.com"

### create amd64
image_amd64:
  extends: .dind
  stage: create
  tags:
    - gitlab-org-docker
  dependencies: 
    - galene_amd64
  needs: 
    - galene_amd64
  rules:
    - if: $CI_SERVER_URL == "https://gitlab.com"
  script:
    - echo "build Movim Version $MOVIM_VERSION"
    - >
      docker buildx build --no-cache --force-rm --compress --load \
        --platform "linux/amd64" \
        --build-arg MOVIM_GIT_REPO=$MOVIM_REPOSITORY \
        --build-arg MOVIM_VERSION=$MOVIM_VERSION \
        -t "${IMAGE_NAME}" \
        -t "${CI_REGISTRY_IMAGE}:amd64" \
        --target movim-amd64 \
        .
    - docker push "${CI_REGISTRY_IMAGE}:amd64"


### add arm64 to manifest
manifest_arm64:
  extends: .dind
  stage: release
  dependencies: [ ]
  needs:
    - image_arm64
  rules:
    - if: $CI_SERVER_URL == "https://gitlab.rimkus.it"
  script:    
    - docker buildx imagetools create --tag "${CI_REGISTRY_IMAGE}:latest" "${CI_REGISTRY_IMAGE}:arm64"  
    - docker buildx imagetools create --tag "${CI_REGISTRY_IMAGE}:${MOVIM_VERSION}" "${CI_REGISTRY_IMAGE}:arm64"
    # append possible amd64
    - docker buildx imagetools create --append --tag "${CI_REGISTRY_IMAGE}:latest" "${CI_REGISTRY_IMAGE}:amd64"  
    - docker buildx imagetools create --append --tag "${CI_REGISTRY_IMAGE}:${MOVIM_VERSION}" "${CI_REGISTRY_IMAGE}:amd64"

### add amd64 to manifest
manifest_amd64:
  extends: .dind
  stage: release
  tags:
    - gitlab-org-docker
  dependencies: [ ]
  needs:
    - image_amd64
  rules:
    - if: $CI_SERVER_URL == "https://gitlab.com"
  script:    
    - docker buildx imagetools create --tag "${CI_REGISTRY_IMAGE}:latest" "${CI_REGISTRY_IMAGE}:amd64"  
    - docker buildx imagetools create --tag "${CI_REGISTRY_IMAGE}:${MOVIM_VERSION}" "${CI_REGISTRY_IMAGE}:amd64"
    # append possible amd64
    - docker buildx imagetools create --append --tag "${CI_REGISTRY_IMAGE}:latest" "${CI_REGISTRY_IMAGE}:arm64"  
    - docker buildx imagetools create --append --tag "${CI_REGISTRY_IMAGE}:${MOVIM_VERSION}" "${CI_REGISTRY_IMAGE}:arm64"